        - generic [ref=e52]:
          - heading "从 Apple Watch S9 换到华为 Fit 5 Pro：一次迟来但正确的取舍" [level=1] [ref=e53]
          - paragraph [ref=e54]: 用了快一年的 Apple Watch S9 45mm，前段时间终于下定决心出掉了。1100 块挂闲鱼秒出，转头用国补在本地门店 1347 元拿下一块华为 Fit 5 Pro。算下来，近乎平换。
          - heading "为什么换？" [level=2] [ref=e55]
          - paragraph [ref=e56]:
            - text: 原因简单到一句话就能说清：
            - strong [ref=e57]: 我实在不想每天充电了。
          - paragraph [ref=e58]: S9 是块好表，屏幕、震动、生态联动都没得挑。但问题是我根本不用那些东西。我不在手表上装 App，不回消息，不打电话，甚至连表盘都懒得换。我需要的就那么几样：看时间、记步数、监测睡眠、偶尔测下心率。这些功能，S9 能做，但代价是精打细算也撑不过两天。每晚摘表放充电器上，成了雷打不动的仪式。出差忘带充电线，表就是一块废铁。
          - heading "Fit 5 Pro 做对了什么？" [level=2] [ref=e59]
          - paragraph [ref=e60]: 而 Fit 5 Pro 呢？严格来说它是个大号手环，但这也正是我要的。它把那几样我真正在乎的功能做到了极致，还多给了几个惊喜。
          - paragraph [ref=e61]:
            - strong [ref=e62]: 1. 续航是降维打击
          - paragraph [ref=e63]: 充满电正常用，十天打底，出差一周连充电器都不用带。这种无感续航，用过就回不去。
          - paragraph [ref=e64]:
            - strong [ref=e65]: 2. 睡眠监测更专业
          - paragraph [ref=e66]: 华为的睡眠分析细致到深睡、浅睡、快速眼动分期，还能监测鼾声——不是那种鸡肋的“是否有鼾声”，而是能给出呼吸暂停风险的初步筛查评估。我家属说我打鼾挺严重，这个功能对我来说是刚需。
          - paragraph [ref=e67]:
            - strong [ref=e68]: 3. 医疗级 ECG
          - paragraph [ref=e69]: 心电图（国内称心电分析）也是实打实的医疗级功能，和 S9 的 ECG 一样能导出 PDF 报告。1347 块买到这个配置，没话说。
          - paragraph [ref=e70]:
            - strong [ref=e71]: 4. 轻薄无感
          - paragraph [ref=e72]: Fit 5 Pro 窄了一圈，睡觉戴几乎无感，这才是睡眠监测设备该有的样子。S9 戴久了手腕会有一圈印记，夏天闷得慌，这一点改善尤为明显。
          - heading "我牺牲了什么？" [level=2] [ref=e73]
          - paragraph [ref=e74]: 至于牺牲了什么？蜂窝网络、独立 App、丰富的表盘生态、和 iPhone 的无缝联动。
          - paragraph [ref=e75]: 但这些对我来说，从来就不是刚需。我甚至觉得，少了那些通知轰炸，手腕反而清净了。
          - heading "写在最后" [level=2] [ref=e76]
          - paragraph [ref=e77]:
            - text: 说到底，这次换机不是降级，是
            - strong [ref=e78]: 认清自己需求后的精准匹配
            - text: 。我不需要一个手腕上的迷你手机，我只需要一个靠谱的健康监测工具和一个不用操心的手表。Fit 5 Pro 做到了，而且比 S9 做得更好——至少在我在乎的方向上。
          - blockquote [ref=e79]:
            - paragraph [ref=e80]: 如果你也在纠结类似的选择，不妨问自己一句：你的手表，到底是用来干什么的？
            - paragraph [ref=e81]: 答案可能比想象中简单。
