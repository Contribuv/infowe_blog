          - heading "从同步到异步的进化之路" [level=2] [ref=e36]
          - paragraph [ref=e37]: Python 的异步编程经历了漫长而痛苦的进化。让我们从头梳理这条路，理解每一步解决了什么问题。
          - heading "第一阶段：同步阻塞" [level=3] [ref=e38]
          - code [ref=e40]:
            - text: import time
            - generic [ref=e41]: "def fetch_data(url):"
            - text: "time.sleep(1) # 模拟网络请求 return"
            - generic [ref=e42]: "f\"Data from {url}\""
            - generic [ref=e43]: "def main():"
            - text: "urls = [\"api/1\", \"api/2\", \"api/3\"] results = [fetch_data(url) for url in urls] print(results) # 耗时 3 秒"
          - paragraph [ref=e44]: 这是最原始的方式 — 一个任务做完才能做下一个。CPU 大量时间花在等待 I/O 上。
          - heading "第二阶段：多线程" [level=3] [ref=e45]
          - code [ref=e47]:
            - text: from concurrent.futures import ThreadPoolExecutor
            - generic [ref=e48]: "def fetch_data(url):"
            - text: time.sleep(1) return
            - generic [ref=e49]: "f\"Data from {url}\""
            - text: "with ThreadPoolExecutor(max_workers=10) as executor: results = list(executor.map(fetch_data, urls)) # 耗时约 1 秒，但有 GIL 限制"
          - paragraph [ref=e50]: 多线程解决了并发问题，但 Python 的 GIL 让 CPU 密集型任务无法真正并行，线程切换也有开销。
          - heading "第三阶段：回调函数（Callback Hell）" [level=3] [ref=e51]
          - code [ref=e53]:
            - generic [ref=e54]: "def fetch_data(url, callback):"
            - generic [ref=e55]: "def on_done():"
            - text: "result = http_get(url) # 伪代码 callback(result) schedule(on_done)"
          - paragraph [ref=e56]: 回调解决了同步等待的问题，但导致了著名的"回调地狱"——嵌套的回调让代码难以阅读和维护。
          - heading "第四阶段：生成器协程（yield from）" [level=3] [ref=e57]
          - code [ref=e59]:
            - text: import asyncio @asyncio.coroutine
            - generic [ref=e60]: "def fetch_data(url):"
            - text: response = yield from aiohttp_get(url) return response
          - paragraph [ref=e61]:
            - text: Python 3.4 引入了
            - code [ref=e62]: asyncio
            - text: 和
            - code [ref=e63]: yield from
            - text: 语法，用生成器来模拟协程。这是一个巨大的进步，但写法仍然别扭。
          - heading "第五阶段：async/await（现代方案）" [level=3] [ref=e64]
          - code [ref=e66]:
            - text: import asyncio import aiohttp async
            - generic [ref=e67]: "def fetch_data(session, url):"
            - text: "async with session.get(url) as response: return await response.json() async"
            - generic [ref=e68]: "def main():"
            - text: "async with aiohttp.ClientSession() as session: tasks = [fetch_data(session,"
            - generic [ref=e69]: "f\"api/{i}\""
            - text: ) for i in range(10)] results = await asyncio.gather(*tasks) return results asyncio.run(main())
          - paragraph [ref=e70]: 这才是我们想要的！代码读起来像同步，性能像异步。
