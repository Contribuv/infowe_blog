{% extends "base.html" %}
{% block title %}页面不存在{% endblock %}
{% block content %}
<div class="tech-error">
    <div class="tech-error-code">4<span>0</span>4</div>
    <h1 class="tech-error-title">页面不存在</h1>
    <p class="tech-error-desc">你访问的页面可能已被删除或从未存在过。</p>
    <div class="tech-error-code-block">
        <pre><span class="hl-error">$</span> curl -I {{ request.url }}
HTTP/1.1 <span class="hl-error">404 Not Found</span>
Content-Type: text/html
Connection: close</pre>
    </div>
    <a href="/" class="tech-btn tech-btn-primary">返回首页</a>
</div>
{% endblock %}
