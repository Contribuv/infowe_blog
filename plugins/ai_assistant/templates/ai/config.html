{% extends "admin/base.html" %}
{% block admin_title %}AI 助手配置{% endblock %}

{% block admin_content %}
<div class="page-header">
    <h2>{{ icon('zap', 20) | safe }} AI 助手配置</h2>
    <a href="{{ url_for('admin_plugin_ai_chat') }}" class="btn btn-secondary">打开对话</a>
</div>

<div class="card">
    <div class="card-header"><h3>接口</h3></div>
    <form method="POST" action="{{ url_for('admin_plugin_ai_save') }}">
        <div class="form-grid">
            <div class="form-group">
                <label>接口地址</label>
                <input type="url" name="base_url" class="input-text" value="{{ cfg.base_url }}"
                       placeholder="https://api.deepseek.com/v1" required>
                <span class="form-hint">OpenAI 兼容的 /chat/completions 前缀</span>
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" name="api_key" class="input-text" value="{{ masked_key }}"
                       placeholder="留空或保持 **** 表示不修改" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>模型</label>
                <input type="text" name="model" class="input-text" value="{{ cfg.model }}" required>
            </div>
            <div class="form-group">
                <label>温度</label>
                <input type="number" name="temperature" class="input-text" value="{{ cfg.temperature }}" min="0" max="2" step="0.1">
            </div>
            <div class="form-group">
                <label>最大输出 tokens</label>
                <input type="number" name="max_tokens" class="input-text" value="{{ cfg.max_tokens }}" min="100" max="8000">
            </div>
            <div class="form-group">
                <label>超时（秒）</label>
                <input type="number" name="timeout" class="input-text" value="{{ cfg.timeout }}" min="10" max="300">
            </div>
            <div class="form-group">
                <label>每日调用上限</label>
                <input type="number" name="daily_call_limit" class="input-text" value="{{ cfg.daily_call_limit }}" min="10" max="5000">
                <span class="form-hint">今日已调用 {{ daily_calls }} 次</span>
            </div>
        </div>

        <div class="form-group">
            <label>系统提示词</label>
            <textarea name="system_prompt" class="input-text" rows="7">{{ cfg.system_prompt }}</textarea>
        </div>

        <div class="card-header" style="margin-top:8px"><h3>AI 托管</h3></div>
        <div class="form-grid">
            <label class="check-row"><input type="checkbox" name="comment_moderation" {% if cfg.comment_moderation %}checked{% endif %}> 新评论自动审核</label>
            <label class="check-row"><input type="checkbox" name="comment_reply" {% if cfg.comment_reply %}checked{% endif %}> 审核通过后 AI 回复</label>
            <label class="check-row"><input type="checkbox" name="link_moderation" {% if cfg.link_moderation %}checked{% endif %}> 友链回链自动审核</label>
            <div class="form-group">
                <label>评论最短长度</label>
                <input type="number" name="comment_min_length" class="input-text" value="{{ cfg.comment_min_length }}" min="0" max="200">
            </div>
            <div class="form-group">
                <label>友链复查时长（小时）</label>
                <input type="number" name="link_check_hours" class="input-text" value="{{ cfg.link_check_hours }}" min="1" max="720">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存配置</button>
        </div>
    </form>
</div>
{% endblock %}
