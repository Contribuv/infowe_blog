{% extends "admin/base.html" %}
{% block admin_title %}{% if link %}编辑链接{% else %}添加链接{% endif %}{% endblock %}
{% block admin_content %}
<h2>{% if link %}编辑链接{% else %}添加友情链接{% endif %}</h2>

<form method="POST" class="edit-form">
    <div class="form-group">
        <label>站点名称 <span class="required">*</span></label>
        <input type="text" name="name" value="{{ link.name if link else '' }}" required class="form-input">
    </div>
    <div class="form-group">
        <label>URL <span class="required">*</span></label>
        <input type="url" name="url" value="{{ link.url if link else '' }}" required class="form-input" placeholder="https://">
    </div>
    <div class="form-group">
        <label>描述</label>
        <textarea name="description" rows="2" class="form-input">{{ link.description if link else '' }}</textarea>
    </div>
    <div class="form-group">
        <label>头像URL（选填，不填则显示首字母）</label>
        <input type="url" name="avatar" value="{{ link.avatar if link else '' }}" class="form-input" placeholder="https://">
    </div>
    <div class="form-group">
        <label>排序（数字越小越靠前）</label>
        <input type="number" name="sort_order" value="{{ link.sort_order if link else 0 }}" class="form-input" min="0">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('admin_links') }}" class="btn btn-cancel">取消</a>
    </div>
</form>
{% endblock %}
