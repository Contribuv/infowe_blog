{% extends "admin/base.html" %}
{% block admin_title %}{{ '编辑分类' if category else '新建分类' }}{% endblock %}
{% block admin_content %}
<div class="page-header">
    <h2>{{ '编辑分类' if category else '新建分类' }}</h2>
    <div class="page-actions">
        <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary">返回列表</a>
    </div>
</div>

<form method="POST" class="edit-form">
    <div class="form-group">
        <label for="name">分类名称 <span class="req">*</span></label>
        <input type="text" id="name" name="name" value="{{ category.name if category else '' }}"
               placeholder="如：技术随笔" required class="form-input">
    </div>
    <div class="form-group">
        <label for="slug">Slug（留空自动生成）</label>
        <input type="text" id="slug" name="slug" value="{{ category.slug if category else '' }}"
               placeholder="如：tech-notes" class="form-input">
    </div>
    <div class="form-group">
        <label for="sort_order">排序（数字越小越靠前）</label>
        <input type="number" id="sort_order" name="sort_order" value="{{ category.sort_order if category else 0 }}"
               class="form-input" min="0">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('admin_categories') }}" class="btn btn-cancel">取消</a>
    </div>
</form>
{% endblock %}
