# Nginx 站点配置样例（保存为 /etc/nginx/sites-available/infowe.site 并软链启用）
# 适用：域名 infowe.site，gunicorn 监听 127.0.0.1:5000
#
# 启用：
#   ln -s /etc/nginx/sites-available/infowe.site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name infowe.site www.infowe.site;

    # 如需 HTTPS（推荐），用 certbot 申请后将下面这段替换为 443 配置
    # 并保留 80 -> 443 的跳转

    client_max_body_size 20m;   # 允许上传头像/图片/文件

    location /static {
        alias /path/to/your/project/static;   # ← 改成实际绝对路径
        expires 30d;
        access_log off;
    }

    # 上传文件（v1.0.6 起位于项目根 uploads/）
    location /uploads {
        alias /path/to/your/project/uploads;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 关键：把真实客户端 IP 透传给 Flask（配合 ProxyFix）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

